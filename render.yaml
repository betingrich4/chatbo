services:
  - type: web
    name: marisel
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    disk:
      name: marisel-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: API_KEY
        value: gifted
      - key: AI_MODEL
        value: gpt4o
      - key: OWNER_NUMBER
        value: "254740007567"
      - key: CHECK_INTERVAL
        value: "120000"
      - key: MAX_EMOJIS_PER_MESSAGE
        value: "1"
      - key: DATA_DIR
        value: /data
